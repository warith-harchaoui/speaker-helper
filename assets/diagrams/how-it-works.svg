<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1345 432" width="1345" height="432" role="img" aria-labelledby="sph-title sph-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="sph-title">How speaker-helper works: text in, speech out, with the engine chosen by a router that shows its reasoning</title>
  <desc id="sph-desc">A left-to-right plate, and the mirror image of vocal-helper. In: a sentence, a reply, or a whole document. The work, in three numbered stages: the text is cut into speakable chunks and run through a pronunciation lexicon, so names and acronyms come out right; a router picks the engine from the operating condition, offline for quality or streaming for a bounded delay, and prints the reasoning behind the choice; then the chosen engine synthesises in this process, with no server to launch. Out: audio, plus the timed track that lets a page follow along word by word. Underneath, the core object reached through the four surfaces every member exposes.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">IN</text>
  <rect class="io" x="28" y="87" width="237" height="78" rx="10"/>
  <text class="n-title" x="146" y="120" text-anchor="middle">a sentence, a document</text>
  <text class="n-sub" x="146" y="139" text-anchor="middle">text, in any supported language</text>
  <path class="flow" d="M271 126 H287" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="291" y="54" width="776" height="144" rx="12"/>
  <text class="panel-label" x="311" y="76">WHAT IT DOES</text>
  <rect class="stage" x="311" y="94" width="226" height="78" rx="10"/>
  <text class="n-title" x="424" y="127" text-anchor="middle">chunk + pronounce</text>
  <text class="n-sub" x="424" y="146" text-anchor="middle">sentence groups, lexicon, IPA</text>
  <text class="step" x="322" y="110">1</text>
  <path class="flow" d="M541 133 H557" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="563" y="94" width="243" height="78" rx="10"/>
  <text class="n-title" x="684" y="127" text-anchor="middle">route the engine</text>
  <text class="n-sub" x="684" y="146" text-anchor="middle">offline quality vs bounded delay</text>
  <text class="step" x="574" y="110">2</text>
  <path class="flow" d="M810 133 H826" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="832" y="94" width="215" height="78" rx="10"/>
  <text class="n-title" x="939" y="127" text-anchor="middle">synthesise in-process</text>
  <text class="n-sub" x="939" y="146" text-anchor="middle">no server to launch</text>
  <text class="step" x="843" y="110">3</text>
  <path class="flow" d="M1073 126 H1089" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1093" y="40">OUT</text>
  <rect class="io" x="1093" y="87" width="224" height="78" rx="10"/>
  <text class="n-title" x="1205" y="120" text-anchor="middle">speech + a timed track</text>
  <text class="n-sub" x="1205" y="139" text-anchor="middle">so a page can follow along</text>
  <rect class="core" x="457" y="232" width="431" height="54" rx="10"/>
  <text class="on-dark" x="672" y="253" text-anchor="middle">one library, called the same way everywhere</text>
  <text class="on-dark-sub" x="672" y="272" text-anchor="middle">os-helper underneath for logging and file management</text>
  <path class="tie" d="M672 286 V314 H408 V332"/>
  <path class="tie" d="M672 314 H936 V332"/>
  <path class="tie" d="M408 314 V332"/>
  <rect class="surface" x="333" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="408" y="360" text-anchor="middle">Python API</text>
  <path class="tie" d="M584 314 V332"/>
  <rect class="surface" x="509" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="584" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M760 314 V332"/>
  <rect class="surface" x="685" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="760" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M936 314 V332"/>
  <rect class="surface" x="861" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="936" y="360" text-anchor="middle">agent skill</text>
  <text class="caption" x="672" y="412" text-anchor="middle">The router states which engine it chose and what it set aside, so a surprising voice is explainable rather than mysterious.</text>
</svg>
