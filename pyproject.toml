[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-helper"
version = "0.9.3"
description = "Speaker Helper — speech synthesis that runs in your process: say a sentence, stream a reply, or narrate a document with the timed track that lets a page follow along. Kokoro by default (no server), voice cloning through OpenVoice and Chatterbox. The inverse of vocal-helper: text in, speech out. Library + CLI + REST API + MCP + skill, with a built-in evaluation gate."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Warith HARCHAOUI", email = "warith@deraison.ai" },
]
keywords = [
    "tts", "text-to-speech", "speech", "kokoro", "onnx", "streaming",
    "offline", "asyncio", "real-time", "french", "multilingual",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime contract:
# - The engine runs **in this process**. There is no server to start and no
#   port to configure; `speaker-helper install-voice` fetches the weights once
#   over stdlib `urllib`. No HTTP client is declared: `httpx` went with the
#   REST client it existed for, and `requirements.txt` says the same list
#   (a test compares the two).
# - Part of the AI Helpers ecosystem: logging goes through ``os-helper`` and
#   audio slicing/concatenation through ``audio-helper`` (both on PyPI, like
#   every ``*-helper``).
# - Audio crosses the backend boundary as a WAV ``bytes`` payload;
#   soundfile/numpy decode it to lay a narration out and to concatenate
#   streaming chunks.
# - What is NOT here is as deliberate: no ONNX runtime, no torch. A bare
#   install imports, reads a settings file, parses segments and writes WebVTT.
#   The model arrives with `[kokoro]`.
dependencies = [
    # Ecosystem building blocks, resolved from PyPI (no more git pins).
    # Capped below 4 like every other member of the suite. Uncapped, a future
    # os-helper 4.0.0 would be installed silently and break at runtime --
    # os-helper 3.0.0 was itself a breaking release (it dropped its CLI).
    # The floor stays at 1.7.2: the nine functions used here (init_logging,
    # info/warning/error, join, file_exists, temporary_folder,
    # make_temporary_directory, download_file) are long-standing basics,
    # and raising a floor without exercising it would just be a guess.
    "os-helper>=1.7.2,<4",
    "audio-helper>=1.6.0",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "soundfile>=0.12",
    # click powers the one command line (`speaker-helper`). Core, not an
    # extra: the CLI is not optional, so its dependency cannot be either. The
    # cap is the suite's: click 9 already announces removals (`__version__`
    # goes in 9.1), and the group/option API here has not been tried against
    # it.
    "click>=8.1,<9",
]

[project.optional-dependencies]
# The default engine, in-process. `espeakng-loader` is the fallback
# phonemiser: speaker-helper prefers a system espeak-ng, because the wheel's
# copy looks for its data in a CI runner's home directory and kills the
# process from C when it does not find it. On Debian/Ubuntu:
# `apt install espeak-ng`; on macOS: `brew install espeak-ng`.
kokoro = [
    "kokoro-onnx>=0.4",
    "soundfile>=0.12",
    "numpy>=1.24.0",
    "espeakng-loader>=0.2",
]
# Picking the voice from the language the text is actually written in. Without
# it, an unconfigured voice falls back to the default rather than guessing.
detect = [
    "langdetect>=1.0.9",
]
# The cloning half. Both pull torch, which is why they are not in `kokoro`:
# reading a page aloud must not require a deep-learning stack.
openvoice = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
]
chatterbox = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "resemble-perth>=1.0",
]
# Everything that speaks, without the cloning engines' torch stack.
all = [
    "speaker-helper[kokoro,detect]",
]
# REST API server (speaker-helper serve / Docker image).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
]
# The same routes republished as agent tools. `mcp<2.0` is a pin with a
# history: fastapi-mcp 0.4.0 against an unpinned mcp SDK raised a TypeError
# out of `create_app()` — not an ImportError — and that broke every API test,
# not only the MCP ones. The mount below is guarded against more than
# ImportError for the same reason.
mcp = [
    "speaker-helper[server]",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
]
# Speech-to-text via vocal-helper: auto-transcribe a voice-clone reference and
# enable the evaluation round-trip (WER/chrF). Optional — cloning with an
# explicit transcript and speed/anomaly evaluation work without it.
stt = [
    "vocal-helper>=2.0.0,<4",
]
# Speech-to-speech sources (speaker_helper.sources): bring in audio to re-voice.
youtube = [
    "youtube-helper>=1.3.4",
]
podcast = [
    "podcast-helper>=0.4.0",
]
mic = [
    "capture-helper>=0.3.0",
]
# A dedicated evaluation framework (DeepEval) wrapping the native metrics.
eval = [
    "deepeval>=3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    # starlette 1.9.0 moved its TestClient onto httpx2. CI installs
    # `.[dev,server]` and never reads requirements-dev.txt, so putting it
    # only there left the suite red — the declaration has to be where the
    # install actually looks.
    "httpx2>=2.0.0",
]

[project.scripts]
# One command line, in click. `speaker-helper-mcp` is kept because it starts
# a different surface (the agent tool server), not a second way to type the
# same commands.
speaker-helper = "speaker_helper.cli:main"
speaker-helper-mcp = "speaker_helper.mcp:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/speaker-helper"
Issues = "https://github.com/warith-harchaoui/speaker-helper/issues"

[tool.setuptools.packages.find]
include = ["speaker_helper*"]

# Ship the committed evaluation dataset and threshold bar inside the wheel so
# the eval layer works from an installed package, not only a source checkout.
[tool.setuptools.package-data]
speaker_helper = ["eval/data/*.jsonl", "eval/*.yaml", "gui/*.html", "gui/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `-m "not slow"`: the slow marker was declared and never excluded, so the one
# test carrying it ran in every default run — and it is a *performance*
# assertion, `mean_rtf < 1.0` against the real engine. That measures the
# machine, not the code. Measured on 2026-10-19 under load average 133 (three
# agent sessions, a container build, a local model serving): 15.86, a failing
# suite that says nothing about speaker-helper.
#
# Load was not the whole story, though, and the exclusion hid the rest of it:
# that test did not warm the engine up, so the one-off ~5 s ONNX session build
# was billed to the first of three short cases and `mean_rtf` came out at
# 1.2235 on an *idle* M2 Max that synthesises at 0.223 warm. It was measuring
# the model load. Fixed in 0.9.1 by warming up; it now passes here.
#
# Raising the threshold would hide the regressions it exists to catch. Running
# it deliberately, on a quiet machine, is still the answer:
#
#     pytest -m slow
#
# Same decision the rest of this suite already made for its `eval` marker.
addopts = "-q -m 'not slow'"
asyncio_mode = "auto"
markers = [
    # Not "a running Voicebox engine" any more — there is no Voicebox. Kokoro
    # runs in-process since 0.8.0, and what makes this test slow is that it
    # synthesises for real and times it.
    "slow: benchmarks the real engine against a real-time-factor threshold; needs a quiet machine",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

# FastAPI's dependency-injection defaults (Form/File/Query/…) are call
# expressions in argument defaults by design; they are not the mutable-default
# trap B008 targets.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
