[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-helper"
version = "0.1.0"
description = "Speaker Helper — professional text-to-speech (offline + streaming) over a local Voicebox engine. The inverse of vocal-helper: text in, speech out. Library + CLI + REST API, runnable locally (conda + pip) or as a Docker server."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Warith HARCHAOUI", email = "warith@deraison.ai" },
]
keywords = [
    "tts", "text-to-speech", "speech", "voicebox", "kokoro", "streaming",
    "offline", "asyncio", "real-time", "french", "multilingual",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime contract:
# - Talks to a running Voicebox REST engine (native :17493 or the bundled
#   docker-compose on :17600). See README "Voicebox" for how to start one.
# - Audio crosses the API as a WAV ``bytes`` payload; soundfile/numpy decode it
#   to measure duration and to concatenate streaming chunks.
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# REST API server (speaker-helper serve / Docker image).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
speaker-helper = "speaker_helper.cli:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/speaker-helper"
Issues = "https://github.com/warith-harchaoui/speaker-helper/issues"

[tool.setuptools]
packages = ["speaker_helper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: integration tests requiring a running Voicebox engine",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
