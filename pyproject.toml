[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "speaker-helper"
version = "0.6.0"
description = "Speaker Helper — professional text-to-speech (offline + streaming) over a local TTS engine (Voicebox by default). The inverse of vocal-helper: text in, speech out. Library + CLI + REST API, with voice cloning and a built-in AI evaluation gate; runnable locally (conda + pip) or as a Docker server."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "BSD-3-Clause" }
authors = [
    { name = "Warith HARCHAOUI", email = "warith@deraison.ai" },
]
keywords = [
    "tts", "text-to-speech", "speech", "voicebox", "kokoro", "streaming",
    "offline", "asyncio", "real-time", "french", "multilingual",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime contract:
# - Talks to a running TTS engine over REST (Voicebox by default: native
#   :17493 or the bundled docker-compose on :17600). See the README for how to
#   start one. The ``mock`` backend needs no server.
# - Part of the AI Helpers ecosystem: logging goes through ``os-helper`` and
#   audio slicing/concatenation through ``audio-helper`` (both git-installed,
#   like every ``*-helper``).
# - Audio crosses the engine API as a WAV ``bytes`` payload; soundfile/numpy
#   decode it to measure duration and to concatenate streaming chunks.
dependencies = [
    # Pin os-helper to the exact ref audio-helper@v1.5.5 requires (v1.4.1);
    # a different git ref for the same package is an unsolvable pip conflict.
    "os-helper @ git+https://github.com/warith-harchaoui/os-helper.git@v1.4.1",
    "audio-helper @ git+https://github.com/warith-harchaoui/audio-helper.git@v1.5.5",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "soundfile>=0.12",
]

[project.optional-dependencies]
# REST API server (speaker-helper serve / Docker image).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    # Model Context Protocol: exposes the REST endpoints as MCP tools at /mcp.
    "fastapi-mcp>=0.4",
]
# Speech-to-text via vocal-helper: auto-transcribe a voice-clone reference and
# enable the evaluation round-trip (WER/chrF). Optional — cloning with an
# explicit transcript and speed/anomaly evaluation work without it.
stt = [
    "vocal-helper @ git+https://github.com/warith-harchaoui/vocal-helper.git@v0.3.1",
]
# Speech-to-speech sources (speaker_helper.sources): bring in audio to re-voice.
youtube = [
    "youtube-helper @ git+https://github.com/warith-harchaoui/youtube-helper.git@v1.3.3",
]
podcast = [
    "podcast-helper @ git+https://github.com/warith-harchaoui/podcast-helper.git@v0.3.3",
]
mic = [
    "capture-helper @ git+https://github.com/warith-harchaoui/capture-helper.git@v0.2.2",
]
# A dedicated evaluation framework (DeepEval) wrapping the native metrics.
eval = [
    "deepeval>=3",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
speaker-helper = "speaker_helper.cli:main"

[project.urls]
Homepage = "https://github.com/warith-harchaoui/speaker-helper"
Issues = "https://github.com/warith-harchaoui/speaker-helper/issues"

[tool.setuptools.packages.find]
include = ["speaker_helper*"]

# Ship the committed evaluation dataset and threshold bar inside the wheel so
# the eval layer works from an installed package, not only a source checkout.
[tool.setuptools.package-data]
speaker_helper = ["eval/data/*.jsonl", "eval/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "slow: integration tests requiring a running Voicebox engine",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

# FastAPI's dependency-injection defaults (Form/File/Query/…) are call
# expressions in argument defaults by design; they are not the mutable-default
# trap B008 targets.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
