name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        # Pinned: an unpinned install let ruff 0.16 make Markdown code-fence
        # formatting the default, silently breaking format-check on doc examples.
        # Bump this deliberately, not by surprise.
        run: pip install "ruff==0.15.21"
      # PEP 8 is enforced automatically: linting AND formatting must both pass,
      # each blocking the merge like a failing test.
      - name: ruff check
        run: ruff check speaker_helper tests
      - name: ruff format --check
        run: ruff format --check speaker_helper tests

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The two ends of `requires-python = ">=3.10,<3.14"`, not every version in
      # between. Both ends carry information -- 3.10 is the floor a `pip install`
      # will accept, 3.13 the ceiling -- while 3.11 and 3.12 can only fail in
      # ways one of the ends already fails. Four jobs for two bits of signal is
      # the ambition this suite trades away to stay fast.
      #
      # Keeping the floor job matters more here than the saving: every member of
      # the suite declares >=3.10 and this is the only one that runs it, so it
      # is the suite's single piece of evidence that the promise holds. The
      # static half is covered everywhere by ruff, which infers py310 from
      # requires-python, but a missing stdlib module (tomllib on 3.10) is a
      # runtime fault no linter sees.
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # audio-helper slices/concatenates audio through ffmpeg; the fast suite
      # exercises that path (voice-clone trimming), so ffmpeg must be present.
      - name: System deps (ffmpeg)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install (dev + server)
        run: pip install -e ".[dev,server]"
      # The @slow test is a real-time-factor benchmark against the real engine:
      # it measures the machine, and a shared runner is the wrong machine. It
      # is excluded here (see the `slow` marker in pyproject); the fast suite
      # gates merges.
      # Coverage is tracked and gated: the floor (70%) sits just under the
      # current fast-suite total (~74%), which is capped by modules only
      # exercisable against live services (client / transcription / the
      # engine-driven CLI branches). Raise the floor as those gain fakes.
      - name: pytest (fast suite, coverage-gated)
        run: >-
          pytest -q -m "not slow"
          --cov=speaker_helper --cov-report=term-missing --cov-fail-under=70
